[build]
  publish = "public"
  functions = "netlify/functions"
  # Skip rebuilds when only data/ changes (every user report is a commit to data/active.json)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml"
[build.environment]
  NODE_VERSION = "18"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
