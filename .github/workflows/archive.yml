name: Archive expired reports
on:
  schedule: [{ cron: '0 * * * *' }]   # every hour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: node scripts/archive.js
      - run: |
          git config user.name "chaosnav-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "archive expired reports" && git push)
